<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hào Khí 2/9/1945 - Ngày Độc Lập</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #da251d;
            --primary-gold: #ffde1d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            /* Ảnh nền lịch sử kết hợp hiệu ứng trời sáng (nắng vàng) và tối dần ở dưới để hiện rõ chữ */
            background: 
                radial-gradient(circle at 50% 10%, rgba(255, 222, 29, 0.25) 0%, transparent 60%),
                linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%),
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Qu%E1%BA%A3ng_tr%C6%B0%E1%BB%9Dng_Ba_%C4%90%C3%ACnh_ng%C3%A0y_2_9_1945.jpg/1280px-Qu%E1%BA%A3ng_tr%C6%B0%E1%BB%9Dng_Ba_%C4%90%C3%ACnh_ng%C3%A0y_2_9_1945.jpg') no-repeat center top;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .header-title h1 {
            font-family: 'Lora', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .header-title p {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            font-style: italic;
            text-shadow: 1px 2px 5px rgba(0,0,0,0.8);
        }

        /* Giao diện Glassmorphism (Kính mờ) */
        .chat-container {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 1s ease-out;
        }

        /* Khu vực câu hỏi gợi ý */
        .suggestions {
            padding: 20px 20px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .suggestion-btn {
            background: rgba(255, 222, 29, 0.15);
            color: var(--primary-gold);
            border: 1px solid rgba(255, 222, 29, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: var(--primary-gold);
            color: #000;
            transform: scale(1.05);
        }

        .chat-box {
            height: 40vh;
            min-height: 350px;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 1rem;
            animation: fadeIn 0.4s ease-out;
        }

        .bot-msg {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bot-msg strong {
            color: var(--primary-gold);
        }

        .user-msg {
            background: rgba(218, 37, 29, 0.85);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px rgba(218, 37, 29, 0.3);
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .chat-input input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .chat-input input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary-gold);
        }

        .chat-input button {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 0 30px;
            margin-left: 15px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .chat-input button:hover {
            background: #ffea00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 222, 29, 0.5);
        }

        /* Scrollbar trong suốt */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-gold); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 600px) {
            .header-title h1 { font-size: 2rem; }
            .message { max-width: 95%; }
            .chat-input { flex-direction: column; gap: 10px; padding: 15px; }
            .chat-input button { padding: 15px; margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>2 Tháng 9 Năm 1945</h1>
        <p>"Toàn thể dân tộc Việt Nam quyết đem tất cả tinh thần và lực lượng..."</p>
    </div>

    <div class="chat-container">
        <!-- Khung Gợi Ý Câu Hỏi Mới -->
        <div class="suggestions">
            <button class="suggestion-btn" onclick="askQuestion('Bác Hồ bắt đầu đọc bản Tuyên ngôn Độc lập lúc mấy giờ?')">Bác Hồ đọc Tuyên ngôn lúc mấy giờ?</button>
            <button class="suggestion-btn" onclick="askQuestion('Không khí tại Quảng trường Ba Đình lúc đó như thế nào?')">Không khí Quảng trường Ba Đình?</button>
            <button class="suggestion-btn" onclick="askQuestion('Câu nói nổi tiếng nhất của Bác Hồ khi đang đọc Tuyên ngôn là gì?')">Câu nói nổi tiếng ngoài kịch bản?</button>
            <button class="suggestion-btn" onclick="askQuestion('Có bao nhiêu người tham dự lễ độc lập ngày hôm đó?')">Có bao nhiêu người tham dự?</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">
                <strong>🇻🇳 Trợ lý Lịch sử:</strong> Chào bạn! Bức ảnh phía sau là khoảnh khắc hàng vạn đồng bào đang lắng nghe Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập. Bạn muốn tìm hiểu thêm chi tiết nào về ngày lịch sử trọng đại này?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi lịch sử của bạn..." onkeypress="if(event.key==='Enter') sendAIRequest()">
            <button onclick="sendAIRequest()">Gửi</button>
        </div>
    </div>

    <script>
        // Hàm giúp người dùng click vào câu gợi ý là tự động gửi
        function askQuestion(question) {
            document.getElementById('userInput').value = question;
            sendAIRequest();
        }

        async function sendAIRequest() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const promptText = inputField.value.trim();

            if (!promptText) return;

            appendMessage(promptText, 'user-msg');
            inputField.value = '';

            const loadingDiv = appendMessage('...', 'bot-msg');
            loadingDiv.style.fontStyle = 'italic';
            loadingDiv.style.opacity = '0.7';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();
                
                loadingDiv.style.fontStyle = 'normal';
                loadingDiv.style.opacity = '1';

                if (data.reply) {
                    loadingDiv.innerHTML = "<strong>🇻🇳 Trợ lý Lịch sử:</strong><br><br>" + data.reply.replace(/\n/g, '<br>');
                } else {
                    loadingDiv.innerText = data.error || "Có lỗi xảy ra từ máy chủ.";
                    loadingDiv.style.color = "var(--primary-gold)";
                }
            } catch (error) {
                loadingDiv.innerText = "Lỗi kết nối đến máy chủ. Vui lòng thử lại sau.";
                loadingDiv.style.color = "var(--primary-gold)";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
