<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hào Khí 2/9/1945 - Kỷ Niệm Quốc Khánh</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #da251d;
            --primary-gold: #ffde1d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #1a0505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* --- KHUNG CHỨA ẢNH INFOGRAPHIC HOÀNH TRÁNG --- */
        .infographic-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto 25px auto;
            padding: 0 15px;
        }

        .infographic-container img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 222, 29, 0.4);
            display: block;
        }

        /* --- KHUNG CHAT AI TƯƠNG TÁC BÊN DƯỚI --- */
        .chat-section {
            width: 100%;
            max-width: 1300px;
            padding: 0 15px;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: rgba(218, 37, 29, 0.95);
            color: var(--primary-gold);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary-gold);
        }

        .chat-box {
            height: 350px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .bot-msg { background: rgba(40, 40, 40, 0.9); color: #fff; align-self: flex-start; border: 1px solid rgba(255,255,255,0.15); border-bottom-left-radius: 2px; }
        .bot-msg strong { color: var(--primary-gold); }
        .user-msg { background: var(--primary-red); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

        .chat-input { display: flex; padding: 15px; background: rgba(0, 0, 0, 0.5); border-top: 1px solid rgba(255, 255, 255, 0.15); }
        .chat-input input { flex: 1; padding: 12px 15px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; border-radius: 25px; outline: none; }
        .chat-input input::placeholder { color: #ddd; }
        .chat-input input:focus { border-color: var(--primary-gold); background: rgba(255, 255, 255, 0.25); }
        .chat-input button { background: var(--primary-gold); color: #000; border: none; padding: 0 25px; margin-left: 10px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .chat-input button:hover { background: #fff; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- HIỂN THỊ ẢNH INFOGRAPHIC VỪA GỬI -->
    <div class="infographic-container">
        <!-- Đường dẫn trực tiếp định danh file ảnh hiện tại của bạn -->
        <img src="banner-2-9.png" onerror="this.src='image_c7c743.png'" alt="Kỷ niệm Quốc khánh 2/9/1945">
    </div>

    <!-- KHUNG HỎI ĐÁP CÙNG TRỢ LÝ AI -->
    <div class="chat-section">
        <div class="glass-panel">
            <div class="panel-header">🤖 Hỏi Đáp Cùng Trợ Lý Lịch Sử AI</div>
            <div class="chat-box" id="chatBox">
                <div class="message bot-msg">
                    <strong>🇻🇳 Trợ lý AI:</strong> Chào bạn! Hãy hỏi tôi bất kỳ điều gì về mốc son lịch sử 2/9/1945 hoặc các nội dung có trong Infographic phía trên nhé!
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." onkeypress="if(event.key==='Enter') sendAIRequest()">
                <button onclick="sendAIRequest()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        async function sendAIRequest() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const promptText = inputField.value.trim();

            if (!promptText) return;

            appendMessage(promptText, 'user-msg');
            inputField.value = '';

            const loadingDiv = appendMessage('...', 'bot-msg');
            loadingDiv.style.fontStyle = 'italic';
            loadingDiv.style.opacity = '0.7';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                
                loadingDiv.style.fontStyle = 'normal';
                loadingDiv.style.opacity = '1';

                if (data.reply) {
                    loadingDiv.innerHTML = "<strong>🇻🇳 Trợ lý AI:</strong><br>" + data.reply.replace(/\n/g, '<br>');
                } else {
                    loadingDiv.innerText = "Có lỗi xảy ra từ máy chủ.";
                }
            } catch (error) {
                loadingDiv.innerText = "Lỗi kết nối đến máy chủ.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
